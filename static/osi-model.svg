<svg viewBox="0 0 720 520" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans SC','PingFang SC',sans-serif">
  <rect x="6" y="6" width="708" height="508" rx="14" fill="#fafaf8" stroke="#d8d8d2" stroke-width="1.5"/>
  <text x="360" y="40" text-anchor="middle" font-size="20" font-weight="600" fill="#1a1a1a">OSI 七层参考模型</text>
  <text x="360" y="60" text-anchor="middle" font-size="12" fill="#999">数据自上而下封装，自下而上解封装</text>

  <!-- Row template: x=30 w=660 h=54, start y=78, step 60 -->
  <!-- 7 应用层 -->
  <g>
    <rect x="30" y="78" width="660" height="54" rx="9" fill="#eef3f8" stroke="#cfe0ee"/>
    <rect x="40" y="87" width="36" height="36" rx="8" fill="#2f5d86"/>
    <text x="58" y="111" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">7</text>
    <text x="92" y="100" font-size="16" font-weight="600" fill="#1a1a1a">应用层</text>
    <text x="92" y="120" font-size="11" fill="#777">Application</text>
    <text x="300" y="110" font-size="13" fill="#444">HTTP · HTTPS · FTP · SMTP · DNS · Telnet</text>
  </g>
  <!-- 6 表示层 -->
  <g>
    <rect x="30" y="138" width="660" height="54" rx="9" fill="#eef3f8" stroke="#cfe0ee"/>
    <rect x="40" y="147" width="36" height="36" rx="8" fill="#2f5d86"/>
    <text x="58" y="171" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">6</text>
    <text x="92" y="160" font-size="16" font-weight="600" fill="#1a1a1a">表示层</text>
    <text x="92" y="180" font-size="11" fill="#777">Presentation · 编码/加密</text>
    <text x="300" y="170" font-size="13" fill="#444">SSL/TLS · ASCII · JPEG · GIF · DES</text>
  </g>
  <!-- 5 会话层 -->
  <g>
    <rect x="30" y="198" width="660" height="54" rx="9" fill="#eef3f8" stroke="#cfe0ee"/>
    <rect x="40" y="207" width="36" height="36" rx="8" fill="#2f5d86"/>
    <text x="58" y="231" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">5</text>
    <text x="92" y="220" font-size="16" font-weight="600" fill="#1a1a1a">会话层</text>
    <text x="92" y="240" font-size="11" fill="#777">Session · 建立/断开</text>
    <text x="300" y="230" font-size="13" fill="#444">RPC · NFS · SQL · ADSP</text>
  </g>
  <!-- 4 传输层 -->
  <g>
    <rect x="30" y="258" width="660" height="54" rx="9" fill="#fbf3e6" stroke="#eddcc0"/>
    <rect x="40" y="267" width="36" height="36" rx="8" fill="#9a6a2f"/>
    <text x="58" y="291" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">4</text>
    <text x="92" y="280" font-size="16" font-weight="600" fill="#1a1a1a">传输层</text>
    <text x="92" y="300" font-size="11" fill="#777">Transport · 端到端可靠</text>
    <text x="300" y="290" font-size="13" font-weight="600" fill="#9a6a2f">TCP · UDP · SPX</text>
  </g>
  <!-- 3 网络层 -->
  <g>
    <rect x="30" y="318" width="660" height="54" rx="9" fill="#eef5ec" stroke="#d4e6cd"/>
    <rect x="40" y="327" width="36" height="36" rx="8" fill="#5a7d4f"/>
    <text x="58" y="351" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">3</text>
    <text x="92" y="340" font-size="16" font-weight="600" fill="#1a1a1a">网络层</text>
    <text x="92" y="360" font-size="11" fill="#777">Network · 寻址路由</text>
    <text x="300" y="350" font-size="13" font-weight="600" fill="#5a7d4f">IP · ICMP · IGMP · ARP</text>
  </g>
  <!-- 2 数据链路层 -->
  <g>
    <rect x="30" y="378" width="660" height="54" rx="9" fill="#f3eef8" stroke="#e0d4ee"/>
    <rect x="40" y="387" width="36" height="36" rx="8" fill="#7a4f9a"/>
    <text x="58" y="411" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">2</text>
    <text x="92" y="400" font-size="16" font-weight="600" fill="#1a1a1a">数据链路层</text>
    <text x="92" y="420" font-size="11" fill="#777">Data Link · 相邻节点</text>
    <text x="300" y="410" font-size="13" fill="#444">Ethernet · PPP · WiFi(802.11) · VLAN</text>
  </g>
  <!-- 1 物理层 -->
  <g>
    <rect x="30" y="438" width="660" height="54" rx="9" fill="#f3eef8" stroke="#e0d4ee"/>
    <rect x="40" y="447" width="36" height="36" rx="8" fill="#7a4f9a"/>
    <text x="58" y="471" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">1</text>
    <text x="92" y="460" font-size="16" font-weight="600" fill="#1a1a1a">物理层</text>
    <text x="92" y="480" font-size="11" fill="#777">Physical · 比特流</text>
    <text x="300" y="470" font-size="13" fill="#444">RS-232 · RJ-45 · 光纤 · V.35</text>
  </g>
</svg>
